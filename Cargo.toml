[package]
name = "rsamp"
version = "0.1.0"
edition = "2021"
description = "A classic-style music player with .wsz skin support"
license = "MIT"

[[bin]]
name = "rsAmp"
path = "src/main.rs"

[dependencies]
winit = "0.30"
softbuffer = "0.4"
cpal = "0.16"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "flac", "wav", "pcm", "vorbis", "ogg"] }
image = { version = "0.25", default-features = false, features = ["bmp", "png"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
fontdue = "0.9"
id3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

# Native dialogs on Windows/macOS; on Linux use the XDG portal (falls back to zenity),
# which avoids a build-time dependency on GTK development headers.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = "0.15"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
